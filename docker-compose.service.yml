services:
  soil-colour:
    build:
      context: .
      dockerfile: Dockerfile.service
    ports:
      - "127.0.0.1:${SOIL_COLOUR_PORT:-8086}:8080"
    environment:
      SOIL_COLOUR_REFERENCE: /reference/munsell.csv
    volumes:
      - type: bind
        source: ${SOIL_COLOUR_REFERENCE:?Set an absolute path to an approved local reference CSV}
        target: /reference/munsell.csv
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
